[package]
name = "uav-flight-controller"
version = "0.1.0"
edition = "2021"
authors = ["Sivan"]
description = "Fault-tolerant quadcopter flight controller with edge-deployed anomaly detection"

[dependencies]
# RTIC 2.x — the scheduling framework
rtic = { version = "2.1", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.0", features = ["cortex-m-systick"] }

# Cortex-M runtime
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# HAL — swap this line for a different chip:
#   F4 -> stm32f4xx-hal
#   F7 -> stm32f7xx-hal
#   H7 -> stm32h7xx-hal
stm32f4xx-hal = { version = "0.22", features = ["stm32f411", "rtic2"] }

# Logging over RTT (no UART needed for debug output)
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Useful embedded crates
embedded-hal = "1.0"
heapless = "0.8"                                                            # fixed-size collections, no allocator
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }  # for AHRS math

[profile.dev]
opt-level = 1    # 0 is too slow for real-time code; 1 is the sweet spot
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true     # keep symbols for defmt; doesn't bloat flash
